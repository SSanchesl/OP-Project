<!DOCTYPE html>

<head>
    <meta charset="utf-8"/>
    <title>Preview local - Epic Voyage (evidencia)</title>
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1"/>
    <style>
        html, body { margin:0; padding:0; background:#000; width:100%; height:100%; overflow:hidden; }
        #gameDiv { position:absolute; top:0; left:0; right:0; bottom:0; }
        #loginOverlay {
            position:fixed; inset:0; z-index:1000;
            display:flex; align-items:center; justify-content:center;
            background:radial-gradient(circle at center, #1b2a3d 0%, #05070c 100%);
            font-family: Arial, Helvetica, sans-serif;
        }
        #loginOverlay.hidden { display:none; }
        #loginBox {
            width:280px; padding:28px 24px; border-radius:10px;
            background:rgba(20,24,34,0.92); border:1px solid #3a4a63;
            box-shadow:0 8px 30px rgba(0,0,0,0.6);
        }
        #loginBox h1 { margin:0 0 4px; font-size:18px; color:#f0c96b; text-align:center; }
        #loginBox p.sub { margin:0 0 18px; font-size:11px; color:#8ba0bd; text-align:center; }
        #loginBox label { display:block; font-size:12px; color:#c7d2e0; margin:10px 0 4px; }
        #loginBox input {
            width:100%; box-sizing:border-box; padding:8px 10px; border-radius:6px;
            border:1px solid #445267; background:#0f141d; color:#eee; font-size:14px;
        }
        #loginBox input:focus { outline:none; border-color:#f0c96b; }
        #loginBtn {
            width:100%; margin-top:18px; padding:10px; border:none; border-radius:6px;
            background:#c9932f; color:#1a1206; font-weight:bold; font-size:14px; cursor:pointer;
        }
        #loginBtn:disabled { opacity:0.6; cursor:default; }
        #loginBtn:hover:not(:disabled) { background:#e0aa3f; }
        #loginError { min-height:16px; margin-top:10px; font-size:12px; color:#ff6b6b; text-align:center; }
        #loginHint { margin-top:14px; font-size:10px; color:#5c6c82; text-align:center; }
    </style>
</head>
<body>
<div id="loginOverlay">
    <div id="loginBox">
        <h1>Epic Voyage — Servidor Local</h1>
        <p class="sub">Entre com seu usuário e senha (a conta é criada automaticamente no primeiro acesso)</p>
        <form id="loginForm" autocomplete="off">
            <label for="loginUser">Usuário</label>
            <input id="loginUser" name="loginUser" type="text" autocomplete="username" required maxlength="40"/>
            <label for="loginPass">Senha</label>
            <input id="loginPass" name="loginPass" type="password" autocomplete="current-password" required minlength="3" maxlength="60"/>
            <button id="loginBtn" type="submit">Entrar</button>
            <div id="loginError"></div>
        </form>
        <div id="loginHint">Servidor local — só você tem acesso a esse jogo.</div>
    </div>
</div>

<script>
    (function () {
        var checkLogger = function() {
            if (window.Logger && !window.Logger.__safePatched) {
                window.Logger.__safePatched = true;
                var origLog = window.Logger.serverDebugLog;
                window.Logger.serverDebugLog = function() {
                    try {
                        var safeArgs = [];
                        for (var i = 0; i < arguments.length; i++) {
                            var item = arguments[i];
                            if (item === null || item === undefined) safeArgs.push(String(item));
                            else if (typeof item === 'object') safeArgs.push(item.message || item.msg || item.toString() || "[Object]");
                            else safeArgs.push(item);
                        }
                        if (origLog) origLog.apply(window.Logger, safeArgs);
                        else console.log.apply(console, ["[Logger]"].concat(safeArgs));
                    } catch(err) {
                        console.log("[LoggerSafeCatch]", arguments);
                    }
                };
            }
        };
        setInterval(checkLogger, 100);
    })();
    egret.runEgret({renderMode:"webgl", audioType:0, antialias:true});
</script>
<script>
// Corrige bugs no sistema de dialogos/tutorial guiado e destrava batalha
(function () {
    var iv = setInterval(function () {
        if (window.OnHookSingleton && OnHookSingleton.prototype && !OnHookSingleton.prototype.__safePowerPatched) {
            OnHookSingleton.prototype.__safePowerPatched = true;
            OnHookSingleton.prototype.getNeedPower = function () {
                return 0; // Garante que poder minimo nunca impeça de iniciar a batalha
            };
        }

        if (window.TSGuideNode && TSGuideNode.prototype && !TSGuideNode.prototype.__tapFixApplied) {
            TSGuideNode.prototype.__tapFixApplied = true;

            var origButtonGuideTap = TSGuideNode.prototype.buttonGuideTap;
            TSGuideNode.prototype.buttonGuideTap = function () {
                var node = this;
                origButtonGuideTap.apply(node, arguments);
                // reabilita o proximo toque mesmo se tiver delay pendente
                if (!node.isClick) node.isClick = true;
            };

            var origPlayHeroAnimation = TSGuideNode.prototype.playHeroAnimation;
            TSGuideNode.prototype.playHeroAnimation = function () {
                var node = this;
                var wasClickable = node.isClick;
                origPlayHeroAnimation.apply(node, arguments);
                if (wasClickable) {
                    setTimeout(function () {
                        if (!node.isClick) {
                            console.warn("[guide-fix] destravando toque do tutorial");
                            try { GuideInfoManager.getInstance().triggerGuide(); } catch (e) { }
                            node.isClick = true;
                        }
                    }, 2000);
                }
            };
        }
    }, 200);
})();
</script>
<script>
// Gatilho de login local: no app original quem chama isso e um SDK
// nativo (Android/iOS) apos o jogador logar la. Nao existe esse SDK no
// navegador, entao mostramos uma tela de login (usuario+senha, validada
// pelo servidor via /api/login) e so depois disparamos manualmente com
// o usuario confirmado, pra identificar seu save no servidor.
(function () {
    var USER_KEY = "epicVoyageLocalUser";
    var lastUser = localStorage.getItem(USER_KEY);
    // O proprio motor do jogo dispara uma tentativa de reconexao automatica
    // (TSBrowser.getSdkLoginInfo) ANTES do formulario ser preenchido -
    // "user" nao pode ser null nesse momento, senao "ts.loginUserInfo.userId"
    // fica null pra sempre e trava relatorios internos do jogo (reportGameStep)
    // com "Cannot read properties of null (reading 'toString')". So usamos o
    // ultimo usuario lembrado (ou um placeholder) ate o login de verdade
    // (com senha validada) confirmar o usuario real.
    var user = lastUser || "guest";

    var overlay = document.getElementById("loginOverlay");
    var form = document.getElementById("loginForm");
    var userInput = document.getElementById("loginUser");
    var passInput = document.getElementById("loginPass");
    var errorBox = document.getElementById("loginError");
    var loginBtn = document.getElementById("loginBtn");

    if (lastUser) userInput.value = lastUser;

    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        errorBox.textContent = "";
        loginBtn.disabled = true;
        loginBtn.textContent = "Entrando...";
        fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: userInput.value.trim(), password: passInput.value })
        })
            .then(function (r) { return r.json(); })
            .then(function (result) {
                if (!result.ok) {
                    errorBox.textContent = result.error || "Não foi possível entrar.";
                    loginBtn.disabled = false;
                    loginBtn.textContent = "Entrar";
                    return;
                }
                user = userInput.value.trim();
                localStorage.setItem(USER_KEY, user);
                overlay.classList.add("hidden");
                startGameLogin();
            })
            .catch(function (e) {
                errorBox.textContent = "Não consegui falar com o servidor local.";
                loginBtn.disabled = false;
                loginBtn.textContent = "Entrar";
                console.error("[login-local] erro em /api/login", e);
            });
    });

    // Ponte nativa que o Android/iOS forneceria normalmente (TSBrowser.excuteFunction
    // procura essas funcoes em window.*). ToolCommon.enterGame() le isso sem guarda
    // de undefined, entao precisa existir antes do login prosseguir.
    window.getSdkLoginInfo = function () {
        return { userId: user, sign: "" };
    };

    // ts.readJsonFile(name) (ex: "bagPlus_json") depende de window.loadJsonFunc,
    // outra ponte nativa que no app original le o JSON criptografado do pacote
    // local e devolve um ArrayBuffer (o cliente decripta ele mesmo). Aqui os
    // 423 JSONs de configuracao em resource/json/ ja foram descriptografados
    // em disco, entao so precisamos buscar o arquivo e devolver o objeto direto.
    var jsonCache = {};
    function tryFetchJson(url) {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, false);
            xhr.send(null);
            if (xhr.status === 200 || xhr.status === 0) return JSON.parse(xhr.responseText);
        } catch (e) { /* tenta o proximo local */ }
        return undefined;
    }
    window.loadJsonFunc = function (name) {
        if (jsonCache.hasOwnProperty(name)) return jsonCache[name];
        var base = name.replace(/_json$/i, "");
        // "language-cn_json" etc vivem em resource/language/, nao resource/json/
        // - tenta o local certo primeiro pra nao gerar 404 desnecessario no
        // console (so cosmetico, mas polui o log toda vez que abre uma tela).
        var isLanguageFile = /^language-/i.test(base);
        var primary = isLanguageFile ? "resource/language/" : "resource/json/";
        var fallback = isLanguageFile ? "resource/json/" : "resource/language/";
        var result = tryFetchJson(primary + base + ".json");
        if (result === undefined) result = tryFetchJson(fallback + base + ".json");
        if (result === undefined) {
            console.warn("[loadJsonFunc] nao encontrado:", name);
            result = null;
        }
        jsonCache[name] = result;
        return result;
    };
    var loginStarted = false;
    function attemptLogin() {
        if (loginStarted) return;
        try {
            window.ts.loginInfo = window.ts.loginInfo || {};
            console.log("[login-local] entrando como", user);
            window.ToolCommon.sdkLoginSuccess({
                userId: user,
                nickName: user,
                sdk: "web",
                security: "",
                selectServer: ""
            });
            loginStarted = true;
        } catch (e) {
            // RES/egret ainda nao terminou de inicializar internamente
            // (window.ts/ToolCommon ja existem, mas RES.getResByUrl ainda
            // nao esta pronto) - tenta de novo em breve.
            console.warn("[login-local] tentativa falhou, tentando de novo:", e);
        }
    }
    // So dispara o gatilho de entrar no jogo depois que /api/login confirmou
    // usuario+senha (chamado pelo handler de submit do formulario, la em cima).
    function startGameLogin() {
        var tries = 0;
        var iv = setInterval(function () {
            tries++;
            if (loginStarted) {
                clearInterval(iv);
            } else if (window.ts && window.ToolCommon && typeof window.ToolCommon.sdkLoginSuccess === "function") {
                attemptLogin();
            } else if (tries > 300) {
                clearInterval(iv);
                console.error("[login-local] window.ts/ToolCommon nunca apareceram, abortando gatilho de login");
            }
        }, 200);
    }
})();
</script>
